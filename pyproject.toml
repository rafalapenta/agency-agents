[build-system]
requires = ['hatchling>=1.27']
build-backend = 'hatchling.build'

[project]
name = 'aggency'
version = '0.1.0'
description = 'Semantic registry and stateless routing layer for agency-agents'
readme = 'README.md'
requires-python = '>=3.11,<3.15'
license = { text = 'MIT' }
authors = [{ name = 'Rafael' }]
dependencies = [
 'chromadb>=1.5,<2',
 'fastapi>=0.141,<1',
 'fastmcp>=2.14,<3',
 'litellm>=1.96,<2',
 'pydantic>=2.13,<3',
 'pyyaml>=6,<7',
 'sqlalchemy>=2,<3',
 'uvicorn[standard]>=0.41,<1',
]

[project.optional-dependencies]
dev = [
 'httpx>=0.28,<1',
 'pytest>=8,<9',
 'pytest-asyncio>=0.25,<2',
 'ruff>=0.15,<1',
]
local-embeddings = ['sentence-transformers>=5.3,<6']

[project.scripts]
aggency-index = 'src.catalog.indexer:main'
aggency-mcp = 'src.mcp_servers.server:main'

[tool.hatch.build.targets.wheel]
packages = ['src', 'prompts']

[tool.hatch.build.targets.wheel.force-include]
"prompts/domains" = "prompts/domains"

[tool.pytest.ini_options]
testpaths = ['tests']
addopts = '-q'
markers = ['performance: local performance acceptance tests']
